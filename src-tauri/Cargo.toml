[package]
name = "tacknote"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Android loads the app as a shared library; the desktop binary links the rlib.
[lib]
name = "tacknote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
getrandom = "0.3"
# rustls with ring and the bundled Mozilla roots: the same code on desktop and
# Android, without the platform verifier that Android would need wiring for.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
tokio = { version = "1", features = ["time", "sync"] }

# The system keychain: macOS Keychain and Windows Credential Manager. Android
# keeps the password through the Kotlin bridge instead (src/android.rs).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
