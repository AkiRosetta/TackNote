name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Page logic
        run: npm test
      - name: Rust core
        working-directory: src-tauri
        run: cargo test --lib

  # The real app on Windows: the same self-test as on a Mac, with its
  # windows, sticky notes, settings and the system's password storage.
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        working-directory: src-tauri
        run: cargo build
      - name: Self-test
        shell: bash
        working-directory: src-tauri
        run: |
          dir="$RUNNER_TEMP/selftest"
          mkdir -p "$dir"
          TACKNOTE_SELFTEST=1 TACKNOTE_TEST_DIR="$dir" timeout 600 ./target/debug/tacknote.exe 2>&1 | tee selftest.log || true
          TACKNOTE_SELFTEST=restore TACKNOTE_TEST_DIR="$dir" timeout 120 ./target/debug/tacknote.exe 2>&1 | tee restore.log || true
          grep -q "SELFTEST PASSED" selftest.log && grep -q "SELFTEST PASSED" restore.log
