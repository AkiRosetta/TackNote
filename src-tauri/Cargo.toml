[package]
name = "tacknote"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Android loads the app as a shared library; the desktop binary links the rlib.
[lib]
name = "tacknote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
getrandom = "0.3"
